<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de Dados â€” Concurso Petrobras</title>
  <link rel="icon" type="image/svg+xml" href="06-recursos-visuais/images/favicon.svg">
  <style>
    /* TEMAS DE CORES (DARK & LIGHT) */
    :root[data-theme="dark"] {
      --bg-dark: #09131d;
      --bg-surface: rgba(18, 32, 47, 0.75);
      --bg-surface-solid: #12202f;
      --border-panel: rgba(56, 189, 248, 0.22);
      --border-subtle: rgba(255, 255, 255, 0.08);
      
      --accent: #38bdf8;
      --accent-light: #7dd3fc;
      --accent-dark: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      
      --text-primary: #f0f9ff;
      --text-secondary: #bae6fd;
      --text-muted: #64748b;
      
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.14);
      --correct-border: rgba(16, 185, 129, 0.4);
      
      --wrong: #f43f5e;
      --wrong-bg: rgba(244, 63, 94, 0.12);
      --wrong-border: rgba(244, 63, 94, 0.35);
      
      --statement-bg: rgba(0, 0, 0, 0.35);
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-hover: rgba(255, 255, 255, 0.05);
      
      --shadow-premium: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    :root[data-theme="light"] {
      --bg-dark: #f0f9ff;
      --bg-surface: rgba(255, 255, 255, 0.88);
      --bg-surface-solid: #ffffff;
      --border-panel: rgba(56, 189, 248, 0.35);
      --border-subtle: rgba(0, 0, 0, 0.08);
      
      --accent: #0284c7;
      --accent-light: #0369a1;
      --accent-dark: #075985;
      --accent-glow: rgba(2, 132, 199, 0.15);
      
      --text-primary: #0c4a6e;
      --text-secondary: #334155;
      --text-muted: #64748b;
      
      --correct: #059669;
      --correct-bg: rgba(16, 185, 129, 0.14);
      --correct-border: rgba(16, 185, 129, 0.45);
      
      --wrong: #e11d48;
      --wrong-bg: rgba(244, 63, 94, 0.14);
      --wrong-border: rgba(244, 63, 94, 0.45);
      
      --statement-bg: rgba(240, 249, 255, 0.85);
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-hover: rgba(255, 255, 255, 0.95);
      
      --shadow-premium: 0 15px 35px -10px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 45%),
        radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.06) 0px, transparent 45%);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* HEADER */
    header {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.65) 0%, var(--bg-surface-solid) 100%), url('images/cover-banco-dados.svg') center/cover no-repeat;
      border: 1px solid var(--border-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 22px 28px;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow-premium);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-badge {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px var(--accent-glow);
      position: relative;
      overflow: hidden;
      font-size: 1.5rem;
    }

    .brand-title h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .brand-title p {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-label {
      color: var(--text-secondary);
    }
    .stat-label::after {
      content: ":";
    }
    .stat-pill strong {
      color: var(--accent);
      font-weight: 700;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-panel);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .theme-toggle-btn:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
    }

    .btn-home {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-home:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Painel de assuntos especÃ­ficos da IA */
    .specific-topics-panel {
      margin-top: 16px;
      padding: 18px;
      background: var(--statement-bg);
      border: 1px dashed var(--accent);
      border-radius: 14px;
      animation: fadeIn 0.25s ease;
    }
    .specific-topics-panel .stp-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .specific-topics-panel .stp-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .banca-profile {
      margin-top: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .ai-hint {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }
    .setup-status {
      margin-bottom: 22px;
      padding: 12px 14px;
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      background: var(--statement-bg);
      color: var(--text-secondary);
      font-size: 0.86rem;
      line-height: 1.5;
    }
    .setup-status.status-error { border-color: var(--wrong-border); color: var(--wrong); }
    .setup-status.status-warning { border-color: var(--accent); color: var(--text-primary); }
    .setup-status.status-success { border-color: var(--correct-border); color: var(--correct); }
    .badge-timer { color: var(--accent); font-variant-numeric: tabular-nums; }
    .feedback-options {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      white-space: pre-line;
      color: var(--text-secondary);
      font-size: 0.88rem;
    }
    .stp-textarea {
      width: 100%;
      min-height: 90px;
      background: var(--statement-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-family: "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.88rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .stp-textarea::placeholder { color: var(--text-muted); }
    .stp-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .topic-selector-toolbar {
      display: grid;
      grid-template-columns: minmax(170px, auto) minmax(180px, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .topic-select-all {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 700;
    }
    .topic-select-all input,
    .topic-check-item input { accent-color: var(--accent); }
    .topic-filter { min-height: 40px; }
    .btn-clear-topics { width: auto; min-height: 40px; padding-inline: 12px; white-space: nowrap; }
    .topic-checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      max-height: 250px;
      overflow: auto;
      padding: 4px;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--card-bg);
    }
    .topic-check-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 0.78rem;
      line-height: 1.35;
      cursor: pointer;
    }
    .topic-check-item:hover,
    .topic-check-item:focus-within { background: var(--accent-glow); border-color: var(--border-panel); color: var(--text-primary); }
    .topic-check-item span { overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      .topic-selector-toolbar { grid-template-columns: 1fr; }
      .topic-checkbox-grid { grid-template-columns: 1fr; max-height: 220px; }
    }

    /* PANELS */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-premium);
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .step-tag {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--border-panel);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .form-group { margin-bottom: 28px; }
    .form-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    #engine-selector {
      grid-template-columns: repeat(3, 1fr);
    }
    #question-count-selector {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (max-width: 768px) {
      #engine-selector {
        grid-template-columns: 1fr;
      }
    }

    .tile-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      padding: 14px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .tile-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .tile-card input {
      accent-color: var(--accent);
      width: 17px;
      height: 17px;
      margin-top: 2px;
    }

    .tile-selected {
      background: var(--accent-glow) !important;
      border-color: var(--accent) !important;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .tile-selected strong { color: var(--accent) !important; }

    .tile-content strong {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .tile-content p {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .input-field {
      width: 100%;
      background: var(--statement-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      font-size: 0.85rem;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    select.input-field {
      appearance: none;
      min-height: 46px;
      padding-right: 42px;
      background-color: var(--accent-glow);
      background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%);
      background-position: calc(100% - 18px) 20px, calc(100% - 12px) 20px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      border-color: var(--accent);
      color: var(--text-primary);
      font-family: "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    select.input-field:hover { background-color: var(--card-hover); }
    select.input-field option { background: var(--bg-surface-solid); color: var(--text-primary); }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .btn-secondary {
      background: var(--card-bg);
