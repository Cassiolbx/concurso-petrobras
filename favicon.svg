<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c19"/>
      <stop offset="100%" stop-color="#00572b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#FFB700"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#008542"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 209, 0, 0.4)" stroke-width="2"/>

  <!-- Top Accent Highlight -->
  <path d="M 2 18 C 2 9.163 9.163 2 18 2 L 46 2 C 54.837 2 62 9.163 62 18 L 62 20 L 2 20 Z" fill="url(#greenGrad)" opacity="0.35"/>

  <!-- Graduation Cap (Top) -->
  <path d="M 32 14 L 52 23 L 32 32 L 12 23 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M 23 29.5 L 23 38 C 23 42.5 41 42.5 41 38 L 41 29.5" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tassel -->
  <path d="M 46 26 L 49 34 L 49 39" fill="none" stroke="#FFE566" stroke-width="2" stroke-linecap="round"/>
  <circle cx="49" cy="40" r="1.8" fill="#FFE566"/>

  <!-- Open Book Pages (Bottom) -->
  <path d="M 18 43 C 25 40 31 43 32 46 C 33 43 39 40 46 43 L 46 51 C 39 48 33 51 32 53 C 31 51 25 48 18 51 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 32 46 L 32 53" stroke="#00572b" stroke-width="1.5"/>
</svg>